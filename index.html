<style>
:root{color-scheme:light;--page:#f4f5f7;--card:#fff;--line:#e7e9ee;--ink:#0f1419;--ink2:#5b6472;--accent:#4f46e5;--err:#e5484d}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0b0d12;--card:#14171e;--line:#232833;--ink:#eef1f5;--ink2:#a3acba;--accent:#818cf8;--err:#ff6369}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px;
  box-shadow:0 4px 16px rgba(16,24,40,.06)}
.eb{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
input[type=password]{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:17px}
input[type=password]:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:15px;min-height:30px}
button{height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
p{margin:0;font-size:15px;min-height:22px}
p.err{color:var(--err)}
</style>

const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const text=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function put(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}
async function unlock(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(NONCE)},key,bytes(DATA));
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bytes(SALT),iterations:ITER},base,256);
}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  $("b").disabled=true;$("m").className="";$("m").textContent="여는 중입니다...";
  try{
    const raw=await derive($("p").value);
    const saved=$("r").checked?text(raw):null;
    await unlock(raw);
    put(saved);
  }catch(err){
    $("m").className="err";$("m").textContent="비밀번호가 맞지 않습니다. 다시 입력해 주세요.";$("b").disabled=false;$("p").select();
  }
});
(async()=>{
  const saved=get();
  if(saved){try{await unlock(bytes(saved));return;}catch(e){put(null);}}
  $("f").hidden=false;$("p").focus();
})();
})();
